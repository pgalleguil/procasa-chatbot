[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --ignore=tests/test_broker_filters.py
markers =
    optional_broker_scraper: requires the ignored local scraping_yapo_proxys module

# Official reproducible suite:
#   $env:PYTHONPATH='.;tests'; pytest -c pytest-procasa.ini
# Root-level ad-hoc scripts are intentionally outside testpaths because some
# execute sys.exit() during import and are not part of the maintained suite.
