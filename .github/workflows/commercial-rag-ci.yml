name: Commercial RAG Pilot

on:
  pull_request:
    branches: [main]
    paths:
      - "chatbot/commercial_recommendations.py"
      - "tests/test_commercial_recommendations.py"
      - "scripts/commercial_recommendations_dry_run.py"
      - ".github/workflows/commercial-rag-ci.yml"

permissions:
  contents: read

jobs:
  read-only-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile pilot modules
        run: |
          python -m py_compile chatbot/commercial_recommendations.py \
            scripts/commercial_recommendations_dry_run.py \
            tests/test_commercial_recommendations.py
      - name: Unit tests (no Mongo credentials or network)
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_commercial_recommendations.py
